name: Profile data contract

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fluidsbench
      - uses: actions/checkout@v4
        with:
          repository: neilashton/fluidsbench-submission
          # Historical prototype fixture truth uses its original specifications.
          # Current dev feeds are validated separately below.
          ref: f0f5b455929f18fef5c9b41c04beba7468bb3c84
          path: fluidsbench-submission
      - uses: actions/checkout@v4
        with:
          repository: neilashton/fluidsbench-submission
          # Current intake contracts, schemas and pressure audit.
          # Publish this dev revision before the paired website changes.
          ref: 5cd9d5d66410ee70666be9f2b41c99d84d8d2e24
          sparse-checkout: |
            schemas
            docs
            benchmark-specs
            leaderboard
          path: fluidsbench-submission-schemas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fluidsbench/bin/check_dataset_pages.py --submission-root fluidsbench-submission-schemas
      - run: python fluidsbench/bin/check_pressure_references.py --submission-root fluidsbench-submission-schemas
      - run: python fluidsbench/bin/export_profile_locations.py --submission-root fluidsbench-submission-schemas --check
      - run: python fluidsbench/bin/check_profile_contract.py --submission-root fluidsbench-submission --schema-root fluidsbench-submission-schemas
      - run: python fluidsbench/bin/prepare_submission_status.py --submission-root fluidsbench-submission-schemas --check
      - run: ruby fluidsbench/bin/check_launch_contract.rb
      - run: node --test fluidsbench/tests/test_display_replacements.js fluidsbench/tests/test_launch.js fluidsbench/tests/test_leaderboard_compute.js fluidsbench/tests/test_compute_chart.js fluidsbench/tests/test_leaderboard_scores.js fluidsbench/tests/test_leaderboard_verification.js fluidsbench/tests/test_profile_locations.js fluidsbench/tests/test_drivaernetplusplus_profiles.js
      - run: node fluidsbench/bin/check_leaderboard_claim_ui.js
      - run: python -m unittest discover -s fluidsbench/tests -p "test_*.py"
      - name: Checkout current dev leaderboard data
        if: github.base_ref == 'dev' || github.ref_name == 'dev'
        uses: actions/checkout@v4
        with:
          repository: neilashton/fluidsbench-submission
          ref: dev
          path: fluidsbench-submission-dev
      - name: Install dev feed validation dependencies
        if: github.base_ref == 'dev' || github.ref_name == 'dev'
        run: python -m pip install -r fluidsbench-submission-dev/requirements.txt
      - name: Validate current dev submissions and generated feeds
        if: github.base_ref == 'dev' || github.ref_name == 'dev'
        run: python fluidsbench-submission-dev/scripts/manage_leaderboard.py check --dev-intake
      - name: Check website scores against current dev results
        if: github.base_ref == 'dev' || github.ref_name == 'dev'
        env:
          FLUIDSBENCH_SUBMISSION_ROOT: ${{ github.workspace }}/fluidsbench-submission-dev
        run: |
          node --test fluidsbench/tests/test_leaderboard_scores.js fluidsbench/tests/test_airfrans_profiles.js fluidsbench/tests/test_drivaernetplusplus_profiles.js
          python fluidsbench/bin/check_dataset_pages.py --submission-root fluidsbench-submission-dev
          python fluidsbench/bin/check_pressure_references.py --submission-root fluidsbench-submission-dev
          python fluidsbench/bin/prepare_submission_status.py --submission-root fluidsbench-submission-dev --check-contracts
