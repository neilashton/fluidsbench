  inference_latency_ms:
    display_name: "Inference latency"
    short_name: "Latency"
    unit: "ms"
    direction: lower_better
    kind: performance
    range: [0, null]
    decimals: 2
    datasets: [DrivAerNet++]
    group: "Performance"
